[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fiam-pod-platform"
version = "0.1.0"
description = "Auditable strategy research and portfolio replay platform"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
charts = ["plotly>=6"]
research = ["numpy>=1.26", "pandas>=2", "pyarrow>=14", "pypdf>=5", "scipy>=1.11", "xgboost>=2"]
signals = ["numpy>=1.26", "pandas>=2", "pyarrow>=14", "scipy>=1.11", "xgboost>=2"]
graph = ["torch>=2"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pod_platform*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 80
exclude = ["artifacts", ".pod_state"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "PLC0415"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLC0415"]
"scripts/carbonarc/test_*.py" = ["PLC0415"]
