[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fiam-pod-platform"
version = "0.1.0"
description = "Auditable strategy research and portfolio replay platform"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.12,<3"]

[project.optional-dependencies]
research = ["numpy>=1.26", "pandas>=2", "pyarrow>=14", "pypdf>=5", "scipy>=1.11", "xgboost>=2", "httpx", "mcp", "jsonschema"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pod_platform*"]

[tool.setuptools.data-files]
"share/fiam-pod-platform" = ["prompts.txt"]


[tool.ruff]
target-version = "py311"
line-length = 80
exclude = [".pod_state"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "PLC0415"]

[tool.ruff.lint.pydocstyle]
convention = "google"
